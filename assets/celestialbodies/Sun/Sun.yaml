# Sun.yaml

name: Sun
color: "#EDDC4F"

# planetary info
radius: 600000.0 # km
surface_gravity: 286 # m/s^2
day_length: 614.0 # hours

surface_material:
  path: assets/shared/materials/surfaceblank.mat
  properties:
    _Color:
      type: Color
      value: "#FFFFFF"

# orbital info, set to false if there is no orbit (i.e. the Sun)
