# Mozza.yaml

name: Mozza
color: "#E3C481"

# planetary info
radius: 800.0 # km
surface_gravity: 2.5 # m/s^2
day_length: 24.0 # hours

surface_material:
  path: assets/shared/materials/surface.mat
  properties:
    _MainTex:
      type: Texture2D
      value: assets/celestialbodies/Mozza/Mozza.png
    _NormalMap:
      type: Texture2D
      value: assets/celestialbodies/Mozza/Mozza-Normal.png
    _SunAmp:
      type: Float
      value: 0.05

# orbital info, set to false if there is no orbit (i.e. the Sun)
orbit:
  parent: Hamswell
  semimajor_axis: 1.88e5 # km
  eccentricity: 0.062
  longitude_periapsis: 126.0 # deg
  epoch_mean_anom: 102.0 # deg
  epoch_time: 0.0 # s

# atmospheric data, set to false if no atmosphere
atmosphere: false

planet_shine:
  color: "#f0d995"
  intensity: 1
