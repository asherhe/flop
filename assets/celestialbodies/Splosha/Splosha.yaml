# Splosha.yaml

name: Splosha
color: "#6671d8"

# planetary info
radius: 2400.0 # km
surface_gravity: 6.3 # m/s^2
day_length: 47.47 # hours

surface_material:
  path: assets/shared/materials/surfaceblank.mat
  properties:
    _Color:
      type: Color
      value: "#181717"

# orbital info, set to false if there is no orbit (i.e. the Sun)
orbit:
  parent: Gus
  semimajor_axis: 4.0e5 # km
  eccentricity: 0.014
  longitude_periapsis: 244.0 # deg
  epoch_mean_anom: 139.0 # deg
  epoch_time: 0.0 # s

# atmospheric data, set to false if no atmosphere
atmosphere:
  # height to which we simulate atmospheric effects
  height: 50.0 # km

  # pressure characteristics
  sea_level_pressure: 0.7 # atm
  scale_height: 3.5 # km

  # atmospheric rendering - scattering
  material:
    path: assets/shared/materials/atmosphere.mat
    properties:
      _RayleighScaleHeight:
        type: Float
        value: 5000
      _MieScaleHeight:
        type: Float
        value: 800
      _RayleighScatteringCoeff:
        type: Vector
        value: [5.804542996261093e-6, 1.3562911419845635e-5, 3.026590629238531e-5, 1.2619774364741572e-5]
      _MieScatteringCoeff:
        type: Vector
        value: [7.1e-6, 7.1e-6, 7.1e-6, 7.1e-6]
      _MiePhaseG:
        type: Float
        value: 0.6
