# Gus.yaml

name: Gus
color: "#a270ca"

# planetary info
radius: 50000.0 # km
surface_gravity: 34.6 # m/s^2
day_length: 9.0 # hours

surface_material:
  path: assets/shared/materials/surface.mat
  properties:
    _MainTex:
      type: Texture2D
      value: assets/celestialbodies/Gus/Gus.png

# orbital info, set to false if there is no orbit (i.e. the Sun)
orbit:
  parent: Sun
  semimajor_axis: 3.0e8 # km
  eccentricity: 0.067
  longitude_periapsis: 13.0 # deg
  epoch_mean_anom: 65.0 # deg
  epoch_time: 0.0 # s

# atmospheric data, set to false if no atmosphere
atmosphere:
  # height to which we simulate atmospheric effects
  height: 500.0 # km

  # pressure characteristics
  sea_level_pressure: 1.0 # atm
  scale_height: 30.0 # km

  # atmospheric rendering - scattering
  material:
    path: assets/shared/materials/atmosphere.mat
    properties:
      _RayleighScaleHeight:
        type: Float
        value: 30000
      _MieScaleHeight:
        type: Float
        value: 12000
      _RayleighScatteringCoeff:
        type: Vector
        value: [4.9e-5, 1.4e-6, 7.3e-5, 1.1e-5]
      _MieScatteringCoeff:
        type: Vector
        value: [7.1e-6, 7.1e-6, 7.1e-6, 7.1e-6]
      _MiePhaseG:
        type: Float
        value: 0.6

planet_shine:
  color: "#da8bff"
  intensity: 0.2
