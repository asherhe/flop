# Hamswell.yaml

name: Hamswell
color: "#729DE0"

# planetary info
radius: 3000.0 # km
surface_gravity: 9.8 # m/s^2
day_length: 24.0 # hours

surface_material:
  path: assets/shared/materials/surface.mat
  properties:
    _MainTex:
      type: Texture2D
      value: assets/celestialbodies/Hamswell/Hamswell.png
    _SpecularTex:
      type: Texture2D
      value: assets/celestialbodies/Hamswell/Hamswell-Specular.png
    _NormalMap:
      type: Texture2D
      value: assets/celestialbodies/Hamswell/Hamswell-Normal.png
    _LightTex:
      type: Texture2D
      value: assets/celestialbodies/Hamswell/Hamswell-Lights.png
    _LightColor:
      type: Color
      value: "#FFF8B133"
    _HasAtmosphere:
      type: Integer
      value: 1

# orbital info, set to false if there is no orbit (i.e. the Sun)
orbit:
  parent: Sun
  semimajor_axis: 9.2e7 # km
  eccentricity: 0.015
  longitude_periapsis: 0.0 # deg
  epoch_mean_anom: 0.0 # deg
  epoch_time: 0.0 # s

# atmospheric data, set to false if no atmosphere
atmosphere:
  # height to which we simulate atmospheric effects
  height: 80.0 # km

  # pressure characteristics
  sea_level_pressure: 1.0 # atm
  scale_height: 5.0 # km

  # atmospheric rendering - scattering
  material:
    path: assets/shared/materials/atmosphere.mat
    properties:
      _RayleighScaleHeight:
        type: Float
        value: 5000
      _MieScaleHeight:
        type: Float
        value: 800
      _RayleighScatteringCoeff:
        type: Vector
        value: [5.804542996261093e-6, 1.3562911419845635e-5, 3.026590629238531e-5, 1.2619774364741572e-5]
      _MieScatteringCoeff:
        type: Vector
        value: [7.1e-6, 7.1e-6, 7.1e-6, 7.1e-6]
      _MiePhaseG:
        type: Float
        value: 0.6

planet_shine:
  color: "#d3e7ff"
  intensity: 1
