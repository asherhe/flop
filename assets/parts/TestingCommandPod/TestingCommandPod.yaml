# TestingCommandPod.yaml

name: Testing Command Pod
mass: 0.8 # t
crossfeed: true

attachment_nodes:
  - name: top
    pos: { x: 0.0, y: 1.0 }
  - name: bottom
    pos: { x: 0.0, y: -1.0 }

plugins:
  SpritePlugin:
    sprite: assets/parts/TestingCommandPod/TestingCommandPod.png
    size_meters: { x: 2.0, y: 2.0 }
    pivot: { x: 0.5, y: 0.5 }
    material:
      path: assets/shared/materials/part.mat
      properties:
        _NormalMap:
          type: Texture2D
          value: assets/parts/TestingCommandPod/TestingCommandPod-Normal.png
        _EmissionTex:
          type: Texture2D
          value: assets/parts/TestingCommandPod/TestingCommandPod-Light.png
  LightPlugin:
    light_position: { x: 0, y: -0.125 }
    color: "#FFECB1"
    intensity: 0.13
    inner_radius: 0.25
    outer_radius: 1.68
    falloff: 0.89
  CommandPlugin:
    auto_steerable: true
  ReactionWheelPlugin:
    torque: 5 # kN m
