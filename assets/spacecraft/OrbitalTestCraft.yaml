# OrbitalTestCraft.yaml
#
# A craft TEMPLATE: the authored design (parts, attachments, plugins, initial
# rotation). A template has no position in the world, so it carries no `orbit`
# block. A save instance places a copy of this design at a concrete orbit state.

name: Orbital Test Craft

rotation:
  angle: 2.7 # rad
  momentum: -1000 # kg m^2 s^-1

parts:
  - type: TestingCommandPod
    id: TestingCommandPod_1
    name: Testing Command Pod

    transform:
      pos: { x: 0.0, y: 0.0 }
      rot: 0

    attachments:
      - mode: Node
        node: bottom
        attach_part: TestingTank_2 # attached part
        attach_node: top # attachment node of attached part

    plugins:
      SpriteRendererPlugin:
        enabled: true
      CommandPlugin:
        enabled: true
      ReactionWheelPlugin:
        enabled: true

  - type: TestingTank
    id: TestingTank_2
    name: Testing Tank

    transform:
      pos: { x: 0.0, y: -2.0 }
      rot: 0

    attachments:
      - mode: Node
        node: top
        attach_part: TestingCommandPod_1
        attach_node: bottom
      - mode: Node
        node: bottom
        attach_part: TestingEngine_3
        attach_node: top

    plugins:
      SpriteRendererPlugin:
        enabled: true
      ResourceContainerPlugin:
        enabled: true
        amount:
          NTO: 3600
          Hydrazine: 2400
        priority:
          NTO: 0
          Hydrazine: 0

  - type: TestingEngine
    id: TestingEngine_3
    name: Testing Engine

    transform:
      pos: { x: 0.0, y: -3.75 }
      rot: 0

    attachments:
      - mode: Node
        node: top
        attach_part: TestingTank_2
        attach_node: bottom

    plugins:
      SpriteRendererPlugin:
        enabled: true
      EnginePlugin:
        enabled: true
